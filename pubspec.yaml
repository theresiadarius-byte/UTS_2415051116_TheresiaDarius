name: sweet_bliss
description: "Sweet Bliss – Cake & Bakery Catalog. UTS Pemrograman Mobile."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & icons
  cupertino_icons: ^1.0.8

  # Font dari Google Fonts (Playfair Display + Poppins)
  google_fonts: ^6.2.1

  # HTTP request ke TheMealDB API
  http: ^1.2.2

  # Cache gambar dari network
  cached_network_image: ^3.4.1

  # State management
  provider: ^6.1.2

  # Backend Supabase
  supabase_flutter: ^2.6.0

  # Baca file .env
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # File .env perlu didaftarkan sebagai asset supaya flutter_dotenv bisa membacanya
    - .env
